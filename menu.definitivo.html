<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Menú - Café que vende Café</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fdf6f0;
      color: #4b2e2b;
    }
    header {
      background: #4b2e2b;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .contenido {
      max-width: 600px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .item img {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
    }
    .item h3 {
      margin: 0 0 5px 0;
    }
    .precio {
      margin-left: auto;
      font-weight: bold;
      color: #6b4a3a;
      font-size: 18px;
    }
    a.volver {
      display: inline-block;
      margin-top: 10px;
      color: #4b2e2b;
    }
  </style>
</head>
<body>

  <header>
    <h1>Menú</h1>
  </header>

  <div class="contenido">

    <div class="item">
      <img src="https://picsum.photos/seed/filtro/150" alt="Café de filtro">
      <div>
        <h3>Café de Filtro</h3>
        <p>Suave y aromático</p>
      </div>
      <span class="precio">$4.500</span>
    </div>

    <div class="item">
      <img src="https://picsum.photos/seed/expreso/150" alt="Espresso">
      <div>
        <h3>Espresso</h3>
        <p>Fuerte y concentrado</p>
      </div>
      <span class="precio">$5.000</span>
    </div>

    <div class="item">
      <img src="https://picsum.photos/seed/capuccino/150" alt="Capuccino">
      <div>
        <h3>Capuccino</h3>
        <p>Cremoso con leche vaporizada</p>
      </div>
      <span class="precio">$6.500</span>
    </div>

    <a class="volver" href="inicio.html">← Volver al inicio</a>
  </div>

</body>
</html>
